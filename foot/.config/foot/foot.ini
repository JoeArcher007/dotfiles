# ~/.config/foot/foot.ini
# Scale-adaptive: with dpi-aware=no (below), foot multiplies the pixelsize by
# the compositor's scaling factor, so one config renders correctly on every
# machine this is stowed onto -- 20px at 1x, 40px at 2x HiDPI, always crisp.
# No per-machine tuning needed; adjust pixelsize only if the size feels off.

[main]
# pixelsize instead of point size: deterministic on this panel regardless
# of what DPI the compositor reports. Bump to 22 if 20 feels tight.
font=JetBrainsMono Nerd Font Mono:pixelsize=20
dpi-aware=no
pad=0x0 center
bold-text-in-bright=no
initial-window-size-chars=84x30
word-delimiters=,│`|:"'()[]{}<>

[csd]
# foot draws its own titlebar/buttons (no icon support) rather than
# GTK/Adwaita CSDs, but this gets close: dark Modus-neutral chrome, GNOME-ish
# titlebar height, double-click-to-maximize like a normal GNOME app.
preferred=client
size=38
color=ff1e1e1e
border-width=1
border-color=ff303030
button-width=32
button-color=ffd4d4d4
font=JetBrainsMono Nerd Font Mono:pixelsize=15
hide-when-maximized=yes
double-click-to-maximize=yes

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[cursor]
style=block
blink=no
beam-thickness=2
underline-thickness=2

[mouse]
hide-when-typing=yes

[bell]
urgent=no
notify=no
visual=no

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode

[colors-dark]
# Modus Vivendi (Protesilaos Stavrou) on its native pure-black background,
# verbatim from modus-themes.el (modus-themes-vivendi-palette). Same AAA
# guarantee as the light theme above.
#
# Note why the reds and blues are pastel rather than saturated: at 7:1 on pure
# black a colour needs relative luminance >=0.30, and saturated primaries
# simply cannot reach it -- pure red tops out at 5.25:1 and pure blue at
# 2.44:1. Desaturating toward salmon and sky is the only way to be both
# chromatic and AAA here. That is a property of the contrast maths, not a
# stylistic choice; don't "fix" these back to vivid values.
background=000000
foreground=ffffff
selection-background=4a4a4a
selection-foreground=ffffff
# Greys. On black, 7:1 admits only #959595..#ffffff. Slot 8 is Modus's fg-dim
# and clears it at 7.28:1, so dim text stays legible.
#
# Slot 0 is the one deliberate exception in this file: it is Modus's bg-dim,
# a BACKGROUND colour, and at 1.26:1 it is not readable as text. That is true
# of every dark terminal theme including Modus itself -- "black" text on a
# black background cannot be made legible without ceasing to be black. TUIs
# use this slot to paint backgrounds, not glyphs. Every slot that is actually
# rendered as text in this setup is >=7:1.
regular0=1e1e1e
regular7=d4d4d4
bright0=989898
bright7=ffffff
# Chromatic slots, same regular/-cooler pairing as the light theme
# (-warmer for yellow). All >=7:1 on black.
regular1=ff5f59
regular2=44bc44
regular3=d0bc00
regular4=2fafff
regular5=feacd0
regular6=00d3d0
bright1=ff7f86
bright2=00c06f
bright3=fec43f
bright4=00bcff
bright5=b6a0ff
bright6=6ae4b9

[colors-light]
# Modus Operandi Tinted (Protesilaos Stavrou), mapped onto the 16 ANSI slots.
# The Modus themes are built to WCAG AAA -- >=7:1 between background and
# foreground -- and the *tinted* variant darkens its colours specifically to
# hold that ratio on cream paper rather than on pure white. These values are
# verbatim from modus-themes.el (modus-themes-operandi-tinted-palette). Do NOT
# substitute the plain Modus Operandi colours: they are tuned for a #ffffff
# background and only reach ~6.6:1 here, which is AA, not AAA.
background=fbf7f0
foreground=000000
selection-background=c2bcb5
selection-foreground=000000
# Greys. Modus ships no official 16-colour mapping -- Prot argues a 16-slot
# palette can't carry the themes' context-specific intent -- so this ramp is
# ours. On cream, 7:1 admits only #000000..#545454, and that whole budget has
# to cover four slots. Ordered darkest -> lightest as 15, 0, 7, 8, keeping the
# previous palette's convention. Slot 8 is the "dim text" grey and is load
# bearing here (senpai's status colour, tmux's pane borders), so it is held at
# 7:1 rather than being allowed to fade like a typical bright-black.
regular0=1c1c1c
regular7=3a3a3a
bright0=545454
bright7=000000
# Chromatic slots: `regular` is Modus's base colour, `bright` its -cooler
# variant (-warmer for yellow, which reads far more like yellow than the
# maroon -cooler does). On a light background both members of a pair must
# clear 7:1, which leaves no lightness headroom to separate them -- so they
# are distinguished by HUE instead, exactly how Modus separates its own
# colour variants. Every value below is >=7:1 on fbf7f0.
regular1=a60000
regular2=006300
regular3=6d5000
regular4=0031a9
regular5=721045
regular6=00598b
bright1=a0132f
bright2=00603f
bright3=894000
bright4=0000b0
bright5=531ab6
bright6=005f5f

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+o
# Manual dark/light flip, independent of the GNOME-driven sync
color-theme-toggle=Control+Shift+t

[search-bindings]
find-prev=Shift+Return
cursor-left=Left Control+b
cursor-right=Right Control+f
cursor-left-word=Control+Left Mod1+b
cursor-right-word=Control+Right Mod1+f
clipboard-paste=Control+v Control+Shift+v
cancel=Escape Control+g Control+c

[tweak]
# Shape emoji sequences and combining marks correctly (flags, ZWJ emoji,
# accented clusters). Cost is only paid on complex, non-ASCII runs — plain
# ASCII is fast-pathed and unaffected. Flip to `no` if it ever feels sludgy.
grapheme-shaping=yes
