# ~/.config/foot/foot.ini
# Tuned for 13" 1080p @ 100% scale (~166 PPI physical, 96 DPI logical)

[main]
# pixelsize instead of point size: deterministic on this panel regardless
# of what DPI the compositor reports. Bump to 22 if 20 feels tight.
font=JetBrainsMono Nerd Font Mono:pixelsize=20
dpi-aware=no
pad=0x0 center
bold-text-in-bright=no
initial-window-size-chars=84x30
word-delimiters=,│`|:"'()[]{}<>

[csd]
# foot draws its own titlebar/buttons (no icon support) rather than
# GTK/Adwaita CSDs, but this gets close: dark gruvbox chrome, GNOME-ish
# titlebar height, double-click-to-maximize like a normal GNOME app.
preferred=client
size=38
color=ff282828
border-width=1
border-color=ff3c3836
button-width=32
button-color=ffebdbb2
font=JetBrainsMono Nerd Font Mono:pixelsize=15
hide-when-maximized=yes
double-click-to-maximize=yes

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[cursor]
style=block
blink=no
beam-thickness=2
underline-thickness=2

[mouse]
hide-when-typing=yes

[bell]
urgent=no
notify=no
visual=no

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode

[colors-dark]
# Gruvbox (dark) palette on a pure black background
background=000000
foreground=ffffff
selection-background=3c3836
selection-foreground=fbf1c7
regular0=282828
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984
bright0=928374
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=ebdbb2

[colors-light]
# Gruvbox light, tuned for readability: every one of the 16 ANSI colors clears
# WCAG AA (>=4.5:1) against the fbf1c7 background, so senpai nicks and other TUI
# colors stay legible on the cream paper. On this light background `regular` is
# the softer shade and `bright` the deeper/more-saturated one (the inverse of a
# dark theme) — both readable, and distinct from each other.
background=fbf1c7
foreground=000000
selection-background=d5c4a1
selection-foreground=282828
regular0=3c3836
regular1=cc241d
regular2=6b7000
regular3=916000
regular4=2a7183
regular5=9e4d76
regular6=397651
regular7=6b6259
bright0=7c6f64
bright1=9d0006
bright2=525800
bright3=7a4e00
bright4=076678
bright5=8f3f71
bright6=2f5f42
bright7=282828

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+o
# Manual dark/light flip, independent of the GNOME-driven sync
color-theme-toggle=Control+Shift+t

[search-bindings]
find-prev=Shift+Return
cursor-left=Left Control+b
cursor-right=Right Control+f
cursor-left-word=Control+Left Mod1+b
cursor-right-word=Control+Right Mod1+f
clipboard-paste=Control+v Control+Shift+v
cancel=Escape Control+g Control+c

[tweak]
# Shape emoji sequences and combining marks correctly (flags, ZWJ emoji,
# accented clusters). Cost is only paid on complex, non-ASCII runs — plain
# ASCII is fast-pathed and unaffected. Flip to `no` if it ever feels sludgy.
grapheme-shaping=yes
