# ~/.config/tmux/tmux.conf
# tmux 3.x. Read natively from XDG (~/.config/tmux/tmux.conf) since tmux 3.1.

# --- Colour / terminal ------------------------------------------------------
# Advertise a 256-colour terminal to programs inside tmux, then flag the
# OUTER terminal as truecolor-capable so 24-bit colour passes through. foot is
# RGB-capable; the wildcard covers other terminals too. Uses terminal-features
# (tmux 3.2+), the modern replacement for the old terminal-overrides RGB hack.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# --- General behaviour ------------------------------------------------------
# Bigger scrollback than the default 2000 lines.
set -g history-limit 50000

# Enable mouse: click to select panes/windows, drag borders, wheel to scroll.
set -g mouse on

# Don't wait after Escape -- makes vim/nvim feel instant inside tmux.
set -sg escape-time 0

# Renumber and 1-index windows/panes so the numbers match the keyboard row and
# stay gap-free after you close one.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Tell programs (vim, etc.) the window title, and keep tmux's own titles clean.
set -g set-titles on
set -g set-titles-string "#S:#I #W"

# Notify on activity in other windows.
setw -g monitor-activity on
set -g visual-activity off

# --- Key bindings -----------------------------------------------------------
# Prefix stays the default C-b. (Change here if you ever want C-a instead:
#   unbind C-b; set -g prefix C-a; bind C-a send-prefix)

# Reload this config without restarting tmux: prefix + r.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Split panes with | and - , and keep the current directory in the new pane.
# (The defaults are % and " , which are hard to remember.)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows also inherit the current directory.
bind c new-window -c "#{pane_current_path}"

# Vi-style pane navigation: prefix + h/j/k/l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable pane resizing: prefix then H/J/K/L (hold to repeat).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode --------------------------------------------------------------
# Vi keys in copy mode: prefix + [ to enter, then v to select, y to yank.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Status bar -------------------------------------------------------------
# Foreground-on-background styling in the spirit of the shell prompt: legible in
# any ambient light and in both foot themes, no heavy colour blocks.
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=default,fg=default"
set -g status-left "#[bold]#S #[nobold]"
set -g status-left-length 30

# Current window bold; others dimmed.
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bold] #I:#W #[nobold]"
setw -g window-status-activity-style "fg=red"

# Clock + date on the right, clock bold to match the prompt.
set -g status-right "#[bold]%H:%M#[nobold] %Y-%m-%d "
set -g status-right-length 40

# Subtle pane borders; highlight the active one.
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=green"
